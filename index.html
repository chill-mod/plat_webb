<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Chill • Mod - Cộng đồng chia sẻ Telegram chính thức.">
    <meta name="theme-color" content="#000000">
    <title>Chill • Mod</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
    <style>
        :root {
            --red-main: #ff003c;
            --bg-void: #000000;
            --text-pure: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-void);
            background-image:
                radial-gradient(circle at 50% 18%, rgba(255, 0, 60, 0.08) 0%, transparent 60%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 32px 32px, 32px 32px;
            color: var(--text-pure);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 620px;
            padding: 25px 18px;
            flex: 1;
            position: relative;
            z-index: 2;
        }

        /* ===== HEADER ===== */
        header {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
            width: 100%;
        }
        .mech-header-outer {
            position: relative;
            width: 100%;
            max-width: 530px;
            padding: 3px;
            background: linear-gradient(90deg, #ff0000, #ff7700, #ffee00, #00ff55, #00e1ff, #0033ff, #8800ff, #ff0000);
            background-size: 200% 100%;
            animation: flowRainbow 3.5s linear infinite;
            border-radius: 3px;
            box-shadow:
                0 0 25px rgba(255, 0, 60, 0.4),
                0 15px 35px rgba(0, 0, 0, 0.95);
        }
        .mech-header-armor {
            position: relative;
            background: linear-gradient(180deg, #161922 0%, #090a0e 100%);
            border: 2px solid #363c4e;
            border-top: 2px solid #5a647d;
            border-bottom: 3px solid #050608;
            padding: 26px 16px 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.2),
                inset 0 0 15px rgba(0, 0, 0, 0.9),
                0 0 0 2px #101217;
        }

        .mech-bolt {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #3c4253;
            border: 1px solid #141720;
            border-radius: 50%;
            box-shadow: inset 1px 1px 1px rgba(255, 255, 255, 0.6), 0 1px 2px rgba(0, 0, 0, 0.8);
        }
        .bolt-tl { top: 8px; left: 8px; }
        .bolt-tr { top: 8px; right: 8px; }
        .bolt-bl { bottom: 8px; left: 8px; }
        .bolt-br { bottom: 8px; right: 8px; }

        @keyframes flowRainbow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        /* CHỮ CHILL • MOD */
        .header-main-title {
            position: relative;
            display: inline-block;
            font-size: clamp(2.6rem, 10vw, 4rem);
            font-weight: 900;
            letter-spacing: 5px;
            text-transform: uppercase;
            line-height: 1.15;
            text-align: center;
            background: linear-gradient(
                90deg,
                #ff0000 0%, #ff7700 15%, #ffee00 30%, #00ff55 45%,
                #00e1ff 60%, #0033ff 75%, #9900ff 90%, #ff0000 100%
            );
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbowFlow 3s linear infinite;
        }

        .header-main-title::before {
            content: attr(data-text);
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            -webkit-text-fill-color: #0e1118;
            text-shadow:
                1px 1px 0 #9ca7bc, 2px 2px 0 #7b8599, 3px 3px 0 #5c6475,
                4px 4px 0 #414755, 5px 5px 0 #2b2f39, 6px 6px 0 #181a20,
                7px 7px 12px rgba(0, 0, 0, 0.95),
                0 0 20px rgba(255, 0, 60, 0.45);
        }

        @keyframes rainbowFlow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        /* ===== BANNER ===== */
        .banner-list {
            display: flex;
            flex-direction: column;
            gap: 30px;
            width: 100%;
        }
        .banner-card {
            position: relative;
            background: linear-gradient(180deg, #161822 0%, #090a0e 100%);
            border: 2px solid #33394a;
            border-top: 3px solid #5d677f;
            border-bottom: 3px solid #050507;
            padding: 14px;
            box-shadow:
                0 0 0 1px #000000,
                0 0 0 3px #13151c,
                0 15px 35px rgba(0, 0, 0, 0.95),
                inset 0 1px 0 rgba(255, 255, 255, 0.15),
                inset 0 0 15px rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            gap: 14px;
            border-radius: 2px;
        }
        .banner-card-header {
            background: linear-gradient(90deg, #22080d 0%, #151722 45%, #0e1017 100%);
            border: 1px solid #3a4154;
            border-left: 5px solid var(--red-main);
            border-top: 1px solid #636f8f;
            border-bottom: 2px solid #050608;
            padding: 10px 16px;
            font-size: 0.95rem;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            box-shadow:
                0 3px 8px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.2),
                inset 0 -1px 0 rgba(0, 0, 0, 0.7);
        }
        .banner-view-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            display: block;
            background: #000000;
            position: relative;
            border: 2px solid #232733;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.9);
        }
        .banner-view-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease, filter 0.4s ease;
        }
        .banner-card:hover .banner-view-box img {
            transform: scale(1.03);
            filter: contrast(1.08);
        }
        .banner-footer-btn {
            display: flex;
            justify-content: center;
            padding-top: 2px;
        }
        .btn-action-view {
            width: 100%;
            background: linear-gradient(90deg, #94001b 0%, var(--red-main) 50%, #94001b 100%);
            color: #ffffff;
            font-weight: 900;
            text-transform: uppercase;
            text-align: center;
            text-decoration: none;
            padding: 12px 20px;
            font-size: 1rem;
            letter-spacing: 2px;
            border: 1px solid #ff4d6d;
            border-top: 1px solid #ffffff;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(255, 0, 60, 0.35);
            border-radius: 2px;
        }
        .btn-action-view:hover {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.85);
            transform: translateY(-2px);
        }

        /* ===== FOOTER ===== */
        footer {
            width: 100%;
            border-top: 1px solid #141418;
            padding: 24px 15px 90px;
            margin-top: 30px;
            text-align: center;
            background: #000000;
        }
        .footer-content h4 {
            color: var(--red-main);
            font-size: 0.85rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }
        .footer-content p {
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 700;
        }

        /* ===== NÚT TELEGRAM TRÒN ===== */
        .telegram-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #0088cc, #0055ff);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0, 136, 204, 0.6);
            transition: transform 0.3s, box-shadow 0.3s;
            z-index: 1000;
            border: 2px solid #ffffff;
        }
        .telegram-btn:hover {
            transform: scale(1.1) rotate(10deg);
            box-shadow: 0 0 25px rgba(0, 136, 204, 1);
        }
        .telegram-btn svg {
            width: 28px;
            height: 28px;
            fill: #ffffff;
            margin-right: 2px;
        }

        /* ===== RESPONSIVE MOBILE NHỎ ===== */
        @media (max-width: 400px) {
            .container { padding: 18px 12px; }
            .mech-header-armor { padding: 20px 12px 18px; }
            .banner-card { padding: 10px; }
            .btn-action-view { padding: 11px 14px; font-size: 0.92rem; letter-spacing: 1.5px; }
            .telegram-btn { width: 50px; height: 50px; bottom: 16px; right: 16px; }
            .telegram-btn svg { width: 24px; height: 24px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="mech-header-outer">
                <div class="mech-header-armor">
                    <span class="mech-bolt bolt-tl"></span>
                    <span class="mech-bolt bolt-tr"></span>
                    <span class="mech-bolt bolt-bl"></span>
                    <span class="mech-bolt bolt-br"></span>

                    <h1 class="header-main-title" data-text="CHILL • MOD">CHILL • MOD</h1>
                </div>
            </div>
        </header>

        <main class="banner-list">
            <div class="banner-card">
                <div class="banner-card-header">01. Telegram Chill•Mod</div>
                <a href="https://plat-dexx.github.io/plat-unlock/" class="banner-view-box" target="_blank" rel="noopener noreferrer">
                    <img src="ANH1.PNG" alt="Telegram Chill•Mod" loading="lazy">
                </a>
                <div class="banner-footer-btn">
                    <a href="https://t.me/chillmod_shareios" class="btn-action-view" target="_blank" rel="noopener noreferrer">Tham Gia Ngay</a>
                </div>
            </div>
        </main>
    </div>

    <footer>
        <div class="footer-content">
            <h4>Bản Quyền Thuộc Về</h4>
            <p>Developer: Chill • Mod</p>
        </div>
    </footer>

    <a href="https://t.me/plat_dex" class="telegram-btn" target="_blank" rel="noopener noreferrer" aria-label="Telegram">
        <svg viewBox="0 0 24 24">
            <path d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm5.56 8.16l-2.01 9.48c-.15.68-.55.84-1.12.52l-3.1-2.28-1.5 1.44c-.17.17-.31.31-.63.31l.22-3.17 5.77-5.21c.25-.22-.05-.34-.39-.12l-7.13 4.49-3.07-.96c-.67-.21-.68-.67.14-.99l12.01-4.63c.56-.21 1.05.13.83.92z"/>
        </svg>
    </a>

</body>
</html>
